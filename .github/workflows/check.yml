name: Verify application
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: learnquest
          POSTGRES_PASSWORD: learnquest_test
          POSTGRES_DB: learnquest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U learnquest -d learnquest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_TEST_URL: postgres://learnquest:learnquest_test@127.0.0.1:5432/learnquest_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/minimal/package-lock.json
      - run: npm ci
      - run: npm ci --prefix examples/minimal
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://learnquest:learnquest_test@127.0.0.1:5432/learnquest_test
      - run: npm run test:db
      - run: npm run verify:examples
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
