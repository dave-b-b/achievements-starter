name: Bug report
description: Report a reproducible application, example, or documentation problem.
title: "Bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the steps or provide a minimal public reproduction. Remove credentials and personal data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant browser, runtime, SDK versions, and commit or deployment URL.
    validations:
      required: true
